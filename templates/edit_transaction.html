<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit transaction - PennyWise</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main>
        <h1>Edit transaction</h1>

        {% if error %}
        <p>{{ error }}</p>
        {% endif %}

        <form method="POST"
              action="{{ url_for('edit_transaction', transaction_id=transaction['id']) }}">
            <label for="transaction_type">Type</label>
            <select id="transaction_type" name="transaction_type" required>
                <option value="income"
                    {% if transaction["transaction_type"] == "income" %}selected{% endif %}>
                    Income
                </option>
                <option value="expense"
                    {% if transaction["transaction_type"] == "expense" %}selected{% endif %}>
                    Expense
                </option>
            </select>

            <label for="description">Description</label>
            <input id="description" name="description" type="text"
                   value="{{ transaction['description'] }}" required>

            <label for="amount">Amount (£)</label>
            <input id="amount" name="amount" type="number" min="0.01" step="0.01"
                   value="{{ '%.2f'|format(transaction['amount'] / 100) }}" required>

            <label for="category">Category</label>
            <input id="category" name="category" type="text"
                   value="{{ transaction['category'] }}" required>

            <label for="transaction_date">Date</label>
            <input id="transaction_date" name="transaction_date" type="date"
                   value="{{ transaction['transaction_date'] }}" required>

            <button type="submit">Save changes</button>
        </form>

        <p><a href="{{ url_for('transactions') }}">Cancel</a></p>
    </main>
</body>
</html>
